<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Moedas</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <img class="logo" src="/img/exchange-money.png" alt="logo-convert-money">

    <main>

        <label>
            Valor
            <input placeholder="R$ 10.000,00" class="input-valor">
        </label>

        <label>
            Converter <b>de</b>
            <select name="" id="to-convert-select">
                <option value="real">R$ Real Brasileiro</option>
                <option value="dolar">US$ Dólar</option>
                <option value="euro">€ Euro</option>
                <option value="libra">£ Libra</option>
            </select>
        </label>

        <label>
            Converter <b>para</b>
            <select name="" id="convert-select">
                <option value="dolar">US$ Dólar</option>
                <option value="real">R$ Real Brasileiro</option>
                <option value="euro">€ Euro</option>
                <option value="libra">£ Libra</option>
            </select>
        </label>

        <button class="convertButton">Converter</button>

        <section>
            <div class="currency-box">
                <img class="currencyImg-1" src="img/brasil 2.png" alt="logo-moeda-a-converter">
                <p class="currency" id="currency-name-1">Real</p>
                <p class="currency-value" id="value-to-convert">R$ 0,00</p>
            </div>

            <img src="img/seta.png" alt="seta" class="seta">

            <div class="currency-box">
                <img class="currencyImg-2" src="img/estados-unidos (1) 1.png" alt="logo-moeda-convertida">
                <p class="currency" id="currency-name-2">Dólar Americano</p>
                <p class="currency-value" id="value-to-converted">$0.00</p>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
